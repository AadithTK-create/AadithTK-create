<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs>
    <linearGradient id="h-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="h-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="h-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="h-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#ffffff" opacity=".06"/></pattern>
    <clipPath id="h-clip"><rect x="0" y="0" width="900" height="340" rx="22"/></clipPath>
    <style>
      text{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace}
      .disp{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800}
      .fade{animation:fadeUp .9s ease-out both}
      @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
      .pulse{animation:pulse 1.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
      .brk{stroke-dasharray:60;animation:draw 1.2s ease-out both}
      @keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
      .roles text{opacity:0}
      .r1{animation:role 9s infinite 0s}.r2{animation:role 9s infinite 3s}.r3{animation:role 9s infinite 6s}
      @keyframes role{0%{opacity:0;transform:translateY(10px)}6%,30%{opacity:1;transform:none}36%,100%{opacity:0;transform:translateY(-10px)}}
      .bolt{animation:flash 5s infinite}
      @keyframes flash{0%,88%,100%{opacity:0}90%{opacity:1}92%{opacity:.1}94%{opacity:.9}97%{opacity:0}}
      .rain{animation:rain 1.1s linear infinite}
      @keyframes rain{from{transform:translate(0,-40px)}to{transform:translate(-18px,380px)}}
      .hammer{transform-origin:690px 170px;animation:spin 6s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .float{animation:float 4s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>
  </defs>

  <g clip-path="url(#h-clip)">
    <rect width="900" height="340" fill="#0a0d18"/>
    <rect width="900" height="340" fill="url(#h-dots)"/>
    <!-- storm clouds -->
    <ellipse cx="760" cy="10" rx="260" ry="70" fill="#1b2140" opacity=".9"/>
    <ellipse cx="600" cy="0" rx="200" ry="55" fill="#141a33"/>
    <!-- rain -->
    <g stroke="#7dd3fc" stroke-width="1" opacity=".35">
      <line class="rain" x1="520" y1="0" x2="514" y2="14" style="animation-delay:0s"/>
      <line class="rain" x1="580" y1="0" x2="574" y2="14" style="animation-delay:.3s"/>
      <line class="rain" x1="640" y1="0" x2="634" y2="14" style="animation-delay:.7s"/>
      <line class="rain" x1="700" y1="0" x2="694" y2="14" style="animation-delay:.15s"/>
      <line class="rain" x1="760" y1="0" x2="754" y2="14" style="animation-delay:.55s"/>
      <line class="rain" x1="820" y1="0" x2="814" y2="14" style="animation-delay:.9s"/>
      <line class="rain" x1="870" y1="0" x2="864" y2="14" style="animation-delay:.4s"/>
    </g>
    <!-- lightning -->
    <g class="bolt">
      <polygon points="640,20 616,110 646,110 622,200 690,92 658,92 676,20" fill="#fde68a"/>
      <rect width="900" height="340" fill="#93c5fd" opacity=".08"/>
    </g>

    <!-- viewfinder -->
    <g fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
      <path class="brk" d="M470 40 H500 M470 40 V70" style="animation-delay:.2s"/>
      <path class="brk" d="M870 40 H840 M870 40 V70" style="animation-delay:.4s"/>
      <path class="brk" d="M470 300 H500 M470 300 V270" style="animation-delay:.6s"/>
      <path class="brk" d="M870 300 H840 M870 300 V270" style="animation-delay:.8s"/>
    </g>
    <circle cx="486" cy="56" r="5" fill="#ef4444" class="pulse" style="transform-box:fill-box;transform-origin:center"/>
    <text x="498" y="60" font-size="11" fill="#94a3b8">REC · storm_cam_01.mp4</text>

    <!-- hero emblem: original winged lightning crest + spinning hammer-like mace -->
    <circle cx="690" cy="170" r="110" fill="url(#h-glow)"/>
    <g class="float">
      <g class="hammer">
        <rect x="664" y="150" width="52" height="34" rx="6" fill="#64748b"/>
        <rect x="684" y="184" width="12" height="62" rx="4" fill="#92400e"/>
        <polygon points="690,150 700,150 686,172 694,172 680,196 692,168 684,168" fill="#fde68a"/>
      </g>
      <circle cx="690" cy="170" r="84" fill="none" stroke="url(#h-grad)" stroke-width="1.5" stroke-dasharray="4 8"/>
    </g>
    <!-- footer scrubber -->
    <rect x="480" y="288" width="380" height="4" rx="2" fill="#1e293b"/>
    <rect x="480" y="288" width="0" height="4" rx="2" fill="url(#h-grad)">
      <animate attributeName="width" values="0;380;380;0" keyTimes="0;.8;.95;1" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- left text -->
    <g class="fade" style="animation-delay:.1s">
      <rect x="40" y="36" width="190" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".5"/>
      <circle cx="58" cy="49" r="4" fill="#22c55e" class="pulse" style="transform-box:fill-box;transform-origin:center"/>
      <text x="72" y="53" font-size="11" fill="#cbd5e1">open to collabs</text>
    </g>
    <text class="fade" style="animation-delay:.4s" x="40" y="108" font-size="16" fill="#94a3b8">Hi there, I'm</text>
    <text class="disp fade" style="animation-delay:.7s" x="40" y="165" font-size="54" fill="url(#h-grad)">Aadith T K</text>
    <g class="roles" font-size="20" fill="#e2e8f0">
      <text class="r1" x="40" y="205">⚡ Entry-Level AI &amp; ML Engineer</text>
      <text class="r2" x="40" y="205">🛡 Aspiring Cybersecurity Analyst</text>
      <text class="r3" x="40" y="205">🌩 BCA Graduate · Always Learning</text>
    </g>
    <text class="fade" style="animation-delay:1.2s" x="40" y="240" font-size="12.5" fill="#94a3b8">I build smart models and learn to defend systems. Open to junior roles.</text>
    <g class="fade" style="animation-delay:1.5s" font-size="12" fill="#cbd5e1">
      <text x="40" y="288">📍 [CITY]</text>
      <text x="170" y="288">🎓 BCA · Bangalore University</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="898.5" height="338.5" rx="21.5" fill="none" stroke="url(#h-border)" stroke-width="1.5"/>
</svg>
