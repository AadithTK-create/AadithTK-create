<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <linearGradient id="d-grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="d-border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".7"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".2"/></linearGradient>
    <linearGradient id="d-foil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="d-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#fff" opacity=".06"/></pattern>
    <clipPath id="d-card"><rect x="0" y="0" width="200" height="270" rx="16"/></clipPath>
    <style>
      text{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#cbd5e1}
      .drop{animation:drop 1.2s cubic-bezier(.3,1.6,.5,1) both}
      @keyframes drop{from{transform:translateY(-200px)}to{transform:none}}
      .swing{transform-origin:150px 20px;animation:swing 5s ease-in-out infinite}
      @keyframes swing{0%{transform:rotate(8deg)}25%{transform:rotate(-5deg)}50%{transform:rotate(3deg)}75%{transform:rotate(-1.5deg)}100%{transform:rotate(8deg)}}
      .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1.4s ease-out both}
      @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      .pulse{animation:pulse 1.6s infinite}
      @keyframes pulse{50%{opacity:.3}}
    </style>
  </defs>
  <rect width="900" height="420" rx="22" fill="#0a0d18"/>
  <rect width="900" height="420" rx="22" fill="url(#d-dots)"/>
  <rect x=".75" y=".75" width="898.5" height="418.5" rx="21.5" fill="none" stroke="url(#d-border)" stroke-width="1.5"/>

  <!-- ID badge -->
  <g transform="translate(50,0)">
    <g class="drop"><g class="swing">
      <rect x="146" y="0" width="8" height="52" fill="#38bdf8"/>
      <text x="150" y="30" font-size="6" text-anchor="middle" transform="rotate(90 150 30)" style="fill:#0a0d18">STORM SQUAD</text>
      <rect x="140" y="50" width="20" height="14" rx="3" fill="#94a3b8"/>
      <g transform="translate(50,64)">
        <rect width="200" height="270" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".6"/>
        <g clip-path="url(#d-card)">
          <rect x="-100" y="-20" width="60" height="320" fill="url(#d-foil)" transform="rotate(20)">
            <animate attributeName="x" values="-120;320" dur="4s" repeatCount="indefinite"/>
          </rect>
        </g>
        <rect x="70" y="14" width="60" height="8" rx="4" fill="#1e293b"/>
        <!-- portrait placeholder -->
        <rect x="40" y="36" width="120" height="120" rx="14" fill="#1e293b" stroke="url(#d-grad)" stroke-width="2"/>
        <circle cx="100" cy="82" r="22" fill="#334155"/>
        <path d="M58 150 Q100 100 142 150Z" fill="#334155"/>
        <text x="100" y="172" font-size="7" text-anchor="middle" style="fill:#64748b">[ drop your portrait here ]</text>
        <text x="100" y="194" font-size="15" text-anchor="middle" style="fill:#f1f5f9;font-weight:700">AADITH T K</text>
        <text x="100" y="210" font-size="9" text-anchor="middle" style="fill:#38bdf8">AI/ML · CYBERSEC</text>
        <rect x="20" y="224" width="26" height="20" rx="4" fill="#fbbf24"/>
        <g fill="#cbd5e1"><rect x="62" y="226" width="2" height="26"/><rect x="67" y="226" width="4" height="26"/><rect x="74" y="226" width="1.5" height="26"/><rect x="79" y="226" width="3" height="26"/><rect x="85" y="226" width="2" height="26"/><rect x="90" y="226" width="5" height="26"/><rect x="98" y="226" width="1.5" height="26"/><rect x="103" y="226" width="3" height="26"/><rect x="110" y="226" width="2" height="26"/><rect x="116" y="226" width="4" height="26"/><rect x="123" y="226" width="1.5" height="26"/><rect x="128" y="226" width="3" height="26"/></g>
      </g>
    </g></g>
  </g>

  <!-- dashboard -->
  <g transform="translate(340,30)">
    <text font-size="18" y="14" style="fill:#f1f5f9;font-family:'Segoe UI',Arial,sans-serif;font-weight:700">Mission control</text>
    <g>
      <rect y="34" width="170" height="72" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="16" y="58" font-size="10">DEGREE</text>
      <text x="16" y="92" font-size="26" style="fill:#38bdf8;font-weight:700">BCA</text>
      <rect x="190" y="34" width="170" height="72" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="206" y="58" font-size="10">FOCUS</text>
      <text x="206" y="92" font-size="26" style="fill:#a78bfa;font-weight:700">AI/ML</text>
      <rect x="380" y="34" width="170" height="72" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="396" y="58" font-size="10">ALSO</text>
      <text x="396" y="92" font-size="26" style="fill:#fbbf24;font-weight:700">CYBERSEC</text>
    </g>
    <text y="136" font-size="11" style="fill:#94a3b8">Learning focus</text>
    <g font-size="11">
      <text y="168">Python</text><rect x="90" y="158" width="160" height="10" rx="5" fill="#1e293b"/><rect x="90" y="158" width="0" height="10" rx="5" fill="#38bdf8"><animate attributeName="width" from="0" to="120" dur="1.4s" begin="0.2s" fill="freeze"/></rect>
      <text y="206">Machine learning</text><rect x="120" y="196" width="130" height="10" rx="5" fill="#1e293b"/><rect x="120" y="196" width="0" height="10" rx="5" fill="#a78bfa"><animate attributeName="width" from="0" to="80" dur="1.4s" begin="0.4s" fill="freeze"/></rect>
      <text y="244">Cybersecurity</text><rect x="100" y="234" width="150" height="10" rx="5" fill="#1e293b"/><rect x="100" y="234" width="0" height="10" rx="5" fill="#fbbf24"><animate attributeName="width" from="0" to="90" dur="1.4s" begin="0.6s" fill="freeze"/></rect>
      <text y="282" style="fill:#64748b" font-size="10">Bars show focus, not scores.</text>
    </g>
    <g transform="translate(300,140)">
      <rect width="250" height="190" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <circle cx="18" cy="20" r="4" fill="#22c55e" class="pulse"/>
      <text x="30" y="24" font-size="11" style="fill:#f1f5f9">NOW</text>
      <text x="16" y="56" font-size="11">▸ Building: AI/ML projects</text>
      <text x="16" y="80" font-size="11">▸ Learning: security labs</text>
      <text x="16" y="104" font-size="11">▸ Practicing: CTF challenges</text>
      <text x="16" y="128" font-size="11">▸ Seeking: first AI/ML role</text>
      <text x="16" y="168" font-size="10" style="fill:#64748b">Numbers are static: refresh as you grow.</text>
    </g>
  </g>
</svg>
