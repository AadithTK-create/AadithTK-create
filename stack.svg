<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460">
  <defs>
    <radialGradient id="s-core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fde68a"/><stop offset=".4" stop-color="#38bdf8" stop-opacity=".7"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <linearGradient id="s-border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".7"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".2"/></linearGradient>
    <pattern id="s-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#fff" opacity=".06"/></pattern>
    <style>
      text{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#cbd5e1}
      .chip{fill:#0f172a;stroke:#334155;animation:glow 8s infinite}
      @keyframes glow{0%,10%,100%{stroke:#334155}4%{stroke:#38bdf8}}
      .core{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes pulse{50%{transform:scale(1.15)}}
    </style>
  </defs>
  <rect width="900" height="460" rx="22" fill="#0a0d18"/>
  <rect width="900" height="460" rx="22" fill="url(#s-dots)"/>
  <rect x=".75" y=".75" width="898.5" height="458.5" rx="21.5" fill="none" stroke="url(#s-border)" stroke-width="1.5"/>
  <text x="32" y="44" font-size="18" style="fill:#f1f5f9;font-family:'Segoe UI',Arial,sans-serif;font-weight:700">Armory · AI/ML &amp; security toolkit</text>

  <!-- orbit system centered at 230,250 -->
  <g transform="translate(230,250)">
    <g fill="none" stroke="#38bdf8" stroke-opacity=".25">
      <ellipse rx="190" ry="70" transform="rotate(-20)"/>
      <ellipse rx="140" ry="55" transform="rotate(35)"/>
      <ellipse rx="95" ry="38" transform="rotate(-70)"/>
    </g>
    <circle class="core" r="34" fill="url(#s-core)"/>
    <text y="5" font-size="16" text-anchor="middle" style="fill:#0a0d18">⚡</text>

    <!-- orbit 1: JS / React / Node -->
    <g transform="rotate(-20)">
      <g>
        <animateMotion dur="14s" repeatCount="indefinite" path="M190,0 A190,70 0 1,1 -190,0 A190,70 0 1,1 190,0"/>
        <circle r="17" fill="#0f172a" stroke="#61dafb"/><text y="4" font-size="11" text-anchor="middle" style="fill:#61dafb">AI</text>
        <!-- moons around React -->
        <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
          <circle cx="30" r="7" fill="#0f172a" stroke="#fbbf24"/><text x="30" y="3" font-size="7" text-anchor="middle" style="fill:#fbbf24">ML</text></g>
        <g><animateTransform attributeName="transform" type="rotate" from="180" to="540" dur="4.5s" repeatCount="indefinite"/>
          <circle cx="38" r="7" fill="#0f172a" stroke="#f472b6"/><text x="38" y="3" font-size="7" text-anchor="middle" style="fill:#f472b6">DL</text></g>
      </g>
      <g>
        <animateMotion dur="14s" begin="-7s" repeatCount="indefinite" path="M190,0 A190,70 0 1,1 -190,0 A190,70 0 1,1 190,0"/>
        <circle r="17" fill="#0f172a" stroke="#84cc16"/><text y="4" font-size="10" text-anchor="middle" style="fill:#84cc16">Kali</text>
      </g>
    </g>
    <!-- orbit 2 -->
    <g transform="rotate(35)">
      <g><animateMotion dur="11s" repeatCount="indefinite" path="M140,0 A140,55 0 1,0 -140,0 A140,55 0 1,0 140,0"/>
        <circle r="16" fill="#0f172a" stroke="#3776ab"/><text y="4" font-size="10" text-anchor="middle" style="fill:#60a5fa">Py</text></g>
      <g><animateMotion dur="11s" begin="-5.5s" repeatCount="indefinite" path="M140,0 A140,55 0 1,0 -140,0 A140,55 0 1,0 140,0"/>
        <circle r="16" fill="#0f172a" stroke="#a78bfa"/><text y="4" font-size="10" text-anchor="middle" style="fill:#a78bfa">Net</text></g>
    </g>
    <!-- orbit 3 -->
    <g transform="rotate(-70)">
      <g><animateMotion dur="8s" repeatCount="indefinite" path="M95,0 A95,38 0 1,1 -95,0 A95,38 0 1,1 95,0"/>
        <circle r="14" fill="#0f172a" stroke="#fb923c"/><text y="4" font-size="9" text-anchor="middle" style="fill:#fb923c">Git</text></g>
    </g>
  </g>

  <!-- chip grid -->
  <g font-size="12">
    <text x="500" y="90" style="fill:#38bdf8">AI / ML</text>
    <g><rect class="chip" x="500" y="100" width="90" height="28" rx="14" style="animation-delay:0s"/><text x="545" y="118" text-anchor="middle">Python</text>
       <rect class="chip" x="600" y="100" width="110" height="28" rx="14" style="animation-delay:.5s"/><text x="655" y="118" text-anchor="middle">NumPy/Pandas</text>
       <rect class="chip" x="720" y="100" width="100" height="28" rx="14" style="animation-delay:1s"/><text x="770" y="118" text-anchor="middle">scikit-learn</text></g>
    <text x="500" y="170" style="fill:#a78bfa">DEEP LEARNING</text>
    <g><rect class="chip" x="500" y="180" width="90" height="28" rx="14" style="animation-delay:1.5s"/><text x="545" y="198" text-anchor="middle">TensorFlow</text>
       <rect class="chip" x="600" y="180" width="110" height="28" rx="14" style="animation-delay:2s"/><text x="655" y="198" text-anchor="middle">PyTorch</text>
       <rect class="chip" x="720" y="180" width="100" height="28" rx="14" style="animation-delay:2.5s"/><text x="770" y="198" text-anchor="middle">Jupyter</text></g>
    <text x="500" y="250" style="fill:#fbbf24">CYBERSECURITY</text>
    <g><rect class="chip" x="500" y="260" width="90" height="28" rx="14" style="animation-delay:3s"/><text x="545" y="278" text-anchor="middle">Kali Linux</text>
       <rect class="chip" x="600" y="260" width="110" height="28" rx="14" style="animation-delay:3.5s"/><text x="655" y="278" text-anchor="middle">Wireshark</text>
       <rect class="chip" x="720" y="260" width="100" height="28" rx="14" style="animation-delay:4s"/><text x="770" y="278" text-anchor="middle">Nmap</text></g>
    <text x="500" y="330" style="fill:#f472b6">FOUNDATIONS</text>
    <g><rect class="chip" x="500" y="340" width="90" height="28" rx="14" style="animation-delay:4.5s"/><text x="545" y="358" text-anchor="middle">Linux</text>
       <rect class="chip" x="600" y="340" width="110" height="28" rx="14" style="animation-delay:5s"/><text x="655" y="358" text-anchor="middle">SQL</text>
       <rect class="chip" x="720" y="340" width="100" height="28" rx="14" style="animation-delay:5.5s"/><text x="770" y="358" text-anchor="middle">Git</text></g>
  </g>
  <text x="32" y="440" font-size="10" style="fill:#64748b">Edit the chip labels and orbit icons to match your real stack.</text>
</svg>
