<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="c-border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".7"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".2"/></linearGradient>
    <pattern id="c-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#fff" opacity=".06"/></pattern>
    <style>
      text{font-family:'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;fill:#cbd5e1}
      .card{animation:in .8s ease-out both}
      @keyframes in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
      .nudge{animation:nudge 1.4s ease-in-out infinite}
      @keyframes nudge{50%{transform:translateX(6px)}}
      .wave{transform-origin:150px 150px;animation:wave 2s ease-in-out infinite}
      @keyframes wave{50%{transform:rotate(-8deg)}}
      .sp{animation:sp 2s ease-in-out infinite}
      @keyframes sp{50%{opacity:.2}}
    </style>
  </defs>
  <rect width="900" height="260" rx="22" fill="#0a0d18"/>
  <rect width="900" height="260" rx="22" fill="url(#c-dots)"/>
  <rect x=".75" y=".75" width="898.5" height="258.5" rx="21.5" fill="none" stroke="url(#c-border)" stroke-width="1.5"/>

  <!-- pointing character (original placeholder: swap in your own art) -->
  <g>
    <circle cx="140" cy="100" r="34" fill="#334155"/>
    <path d="M90 210 Q140 120 190 210Z" fill="#38bdf8" opacity=".85"/>
    <g class="wave"><path d="M180 160 L260 120" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/></g>
    <text x="150" y="104" font-size="18" text-anchor="middle">😎</text>
    <text x="140" y="236" font-size="10" text-anchor="middle" style="fill:#64748b">[ your pointing art ]</text>
    <text x="70" y="60" font-size="14" class="sp" style="fill:#fbbf24">✦</text><text x="215" y="70" font-size="12" class="sp" style="fill:#f472b6;animation-delay:.7s">♥</text>
  </g>

  <text x="340" y="48" font-size="18" style="fill:#f1f5f9;font-family:'Segoe UI',Arial,sans-serif;font-weight:700">Summon the squad: let's connect</text>
  <g>
