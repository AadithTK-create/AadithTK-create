    <g class="card" style="animation-delay:.8s"><rect x="610" y="134" width="250" height="52" rx="12" fill="#0f172a" stroke="#f472b6" stroke-opacity=".5"/><text x="632" y="166" font-size="12" style="fill:#f1f5f9">🟢 Open to junior roles</text></g>
